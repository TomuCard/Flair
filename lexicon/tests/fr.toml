# Cas du français : saisie → résultat affiché.
# `expect` : interface en anglais ; `expect_fr` : interface en français (par
# défaut, `expect` avec la virgule décimale). Chaque `id` a son jumeau dans
# en.toml, qui doit donner le même résultat. Exécutés avec le français seul,
# puis combiné aux autres langues ; sans le français, ces saisies ne doivent
# plus être des calculs (sauf `shared = true`).

[[case]]
id = "percent-of"
input = "15% de 240"
expect = "36"

[[case]]
id = "percent-word-of"
input = "100 pourcent de 5"
expect = "5"

[[case]]
id = "percent-add"
input = "240 + 15 pourcent"
expect = "276"

[[case]]
id = "percent-sub"
input = "240 moins 15%"
expect = "204"

[[case]]
id = "percent-ratio"
input = "36 sur 240 en %"
expect = "15%"

[[case]]
id = "times"
input = "3 fois 4"
expect = "12"

[[case]]
id = "times-chain"
input = "3 fois 4 fois 5"
expect = "60"

[[case]]
id = "multiplied"
input = "6 multiplié par 7"
expect = "42"

[[case]]
id = "divided"
input = "10 divisé par 4"
expect = "2.5"
variants = ["5/2"]

[[case]]
id = "plus-minus"
input = "7 plus 5 moins 2"
expect = "10"

