# ---------------------------------------------------------------- ambiguities

# `m`: meter, with `5 min` as a variant; minute in a compound duration.
[[case]]
input = "5m"
expect = "5 m"
variants = ["5 min"]

[[case]]
input = "1h30m → min"
expect = "90 min"

[[case]]
input = "5m30s → s"
expect = "330 s"

# ---------------------------------------------------------------- mixed languages

[[case]]
input = "4 jours to hours"
langs = ["fr", "en"]
expect = "96 hours"
expect_fr = "96 heures"

[[case]]
input = "2 weeks en jours"
langs = ["fr", "en"]
expect = "14 days"
expect_fr = "14 jours"

[[case]]
input = "12 in en cm"
langs = ["fr", "en"]
expect = "30.48 cm"

[[case]]
input = "3 times 4 fois 2"
langs = ["fr", "en"]
expect = "24"

[[case]]
input = "15% de 240 plus 1"
langs = ["fr", "en"]
expect = "37"

[[case]]
input = "an hour en minutes"
langs = ["fr", "en"]
expect = "60 minutes"

