[[case]]
input = "0xff & 0x0f"
expect = "15"

[[case]]
input = "5 xor 3"
expect = "6"

[[case]]
input = "1 << 4"
expect = "16"

[[case]]
input = "not 5"
expect = "-6"

[[case]]
input = "2 + ~5"
expect = "-4"

[[case]]
input = "6 | 3"
expect = "7"

[[case]]
input = "42 → base 36"
expect = "16"

