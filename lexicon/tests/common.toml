# Language-neutral cases (symbols, functions, international units), run with
# every combination of input languages. Extra keys:
# - `none = true`: not a calculation; `too_big = true`: "too big to compute";
# - `langs = ["fr", "en"]`: only when all these languages are active (mixed
#   inputs);
# - settings: `decimal` ("auto", ",", "."), `system` (system language),
#   `binary_prefixes`, `angle` ("deg", "rad"), `digits` (significant).

# ---------------------------------------------------------------- numbers

[[case]]
input = "1e524 * 1.5"
expect = "1.5e524"

[[case]]
input = "2^1000"
expect = "1.071508607e301"

[[case]]
input = "100!"
expect = "9.332621544e157"

[[case]]
input = "6.022e23 * 2"
expect = "1.2044e24"

[[case]]
input = "1E-9 * 3"
expect = "3e-9"

[[case]]
input = "3×10^8"
expect = "300000000"

[[case]]
input = "1/3 + 1/6"
expect = "1/2"
variants = ["0.5"]

[[case]]
input = "1/3"
expect = "0.3333333333"
variants = ["1/3"]

[[case]]
input = "0.1 + 0.2"
expect = "0.3"

[[case]]
input = "2**10"
expect = "1024"

[[case]]
input = "2pi"
expect = "6.283185307"

[[case]]
input = "3(4+1)"
expect = "15"

[[case]]
input = "7 mod 3"
expect = "1"

[[case]]
input = "5!"
expect = "120"

[[case]]
input = "-3 * -4"
expect = "12"

[[case]]
input = "6 ÷ 4"
expect = "1.5"

[[case]]
input = "3 x 4"
expect = "12"

[[case]]
input = "(2 + 3) * (4 − 1)"
expect = "15"

[[case]]
input = "2^0.5"
expect = "1.414213562"

[[case]]
input = "240 * 15%"
expect = "36"

[[case]]
input = "240 + 15%"
expect = "276"

[[case]]
input = "1 500 + 1"
expect = "1501"

[[case]]
input = "2 500 000 / 2"
expect = "1250000"

[[case]]
input = "1 500,75 + 1"
expect = "1501.75"
decimal = ","

[[case]]
input = "1 000 * 2"
expect = "2000"

[[case]]
input = "1'000'000 / 2"
expect = "500000"

[[case]]
input = "1_000 + 1"
expect = "1001"

[[case]]
input = "1,000,000 + 1"
expect = "1000001"

[[case]]
input = "15 00"
none = true

[[case]]
input = "1 5000 + 1"
none = true

# `,` decimal or thousands: the system language decides, the other reading is
# a variant.
[[case]]
input = "1,500 + 1"
system = "fr"
langs = ["fr"]
expect = "2.5"
variants = ["1501"]

[[case]]
input = "1,500 + 1"
system = "en"
langs = ["en"]
expect = "1501"
variants = ["2.5"]

[[case]]
input = "1,500 + 1"
decimal = "."
expect = "1501"

[[case]]
input = "1,500 + 1"
decimal = ","
expect = "2.5"

[[case]]
input = "1,500.25 + 1"
expect = "1501.25"

[[case]]
input = "1,5 * 2"
expect = "3"

