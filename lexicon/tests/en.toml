# English cases: input → displayed result.
# `expect`: English interface; `expect_fr`: French interface (default:
# `expect` with decimal commas). Each `id` has its twin in fr.toml, which must
# give the same result. Run with English alone, then combined with the other
# languages; without English, these inputs must no longer be calculations
# (unless `shared = true`).

[[case]]
id = "percent-of"
input = "15% of 240"
expect = "36"

[[case]]
id = "percent-word-of"
input = "100 percent of 5"
expect = "5"

[[case]]
id = "percent-add"
input = "240 + 15 percent"
expect = "276"

[[case]]
id = "percent-sub"
input = "240 minus 15%"
expect = "204"

[[case]]
id = "percent-ratio"
input = "36 over 240 to %"
expect = "15%"

[[case]]
id = "times"
input = "3 times 4"
expect = "12"

[[case]]
id = "times-chain"
input = "3 times 4 times 5"
expect = "60"

[[case]]
id = "multiplied"
input = "6 multiplied by 7"
expect = "42"

[[case]]
id = "divided"
input = "10 divided by 4"
expect = "2.5"
variants = ["5/2"]

[[case]]
id = "plus-minus"
input = "7 plus 5 minus 2"
expect = "10"

[[case]]
id = "power"
input = "2 to the power of 10"
expect = "1024"

[[case]]
id = "squared"
input = "12 squared"
expect = "144"

[[case]]
id = "cubed"
input = "3 cubed"
expect = "27"

[[case]]
id = "times-pi"
input = "2 times pi"
expect = "6.283185307"

[[case]]
id = "sqrt-words"
input = "square root of 16"
expect = "4"

[[case]]
id = "cbrt-words"
input = "cube root of 27"
expect = "3"

[[case]]
id = "gcd"
input = "gcd(12, 18)"
expect = "6"
shared = true

[[case]]
id = "lcm"
input = "lcm(4, 6)"
expect = "12"
shared = true

[[case]]
id = "prime"
input = "prime(7)"
expect = "7 is prime"
expect_fr = "7 est premier"

[[case]]
