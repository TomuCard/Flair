# English cases: input → displayed result.
# `expect`: English interface; `expect_fr`: French interface (default:
# `expect` with decimal commas). Each `id` has its twin in fr.toml, which must
# give the same result. Run with English alone, then combined with the other
# languages; without English, these inputs must no longer be calculations
# (unless `shared = true`).

[[case]]
id = "percent-of"
input = "15% of 240"
expect = "36"

[[case]]
id = "percent-word-of"
input = "100 percent of 5"
expect = "5"

[[case]]
id = "percent-add"
input = "240 + 15 percent"
expect = "276"

[[case]]
id = "percent-sub"
input = "240 minus 15%"
expect = "204"

[[case]]
id = "percent-ratio"
input = "36 over 240 to %"
expect = "15%"

[[case]]
