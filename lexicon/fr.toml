[[word]]
forms = ["jusqu'au", "jusqu'à", "jusqu'a", "jusqu'au le", "avant le"]
sense = "until"

[[word]]
forms = ["depuis le", "depuis"]
sense = "since"

[[word]]
forms = ["quel jour sommes-nous", "quel jour on est", "quel jour est-on", "on est quel jour", "quelle date", "quelle est la date", "date du jour", "date d'aujourd'hui"]
sense = "today"

[[word]]
forms = ["quelle heure", "quelle heure est-il", "il est quelle heure"]
sense = "now"

[[word]]
forms = ["quel jour", "quel jour était le", "quel jour sera le", "quel jour le", "quel jour tombe le"]
sense = "what_day"

[[word]]
forms = ["heure à", "l'heure à", "quelle heure à", "heure a", "quelle heure est-il à", "heure au", "l'heure au", "quelle heure au", "quelle heure est-il au", "heure aux", "l'heure aux", "quelle heure est-il aux"]
sense = "time_in"

# `demain à 14h`, `15h à Tokyo`, `de 9h à 17h30`.
[[word]]
forms = ["à", "a"]
sense = "at"
when = { before = ["time", "word"] }
priority = 20

[[word]]
forms = ["de"]
sense = "from"
when = { position = "start", before = "time" }

# `temps jusqu'à 18h`.
[[word]]
forms = ["temps", "combien de temps", "combien de jours"]
