# ---------------------------------------------------------------- fonctions

[[word]]
forms = ["racine", "racine carrée", "racine de", "racine carrée de"]
sense = "func:sqrt"

[[word]]
forms = ["racine cubique", "racine cubique de"]
sense = "func:cbrt"

[[word]]
forms = ["pgcd"]
sense = "func:gcd"

[[word]]
forms = ["ppcm"]
sense = "func:lcm"

[[word]]
forms = ["premier", "est premier"]
sense = "func:isprime"

[[word]]
forms = ["arrondi", "arrondir"]
sense = "func:round"

[[word]]
forms = ["valeur absolue"]
sense = "func:abs"

[[word]]
forms = ["partie entière"]
sense = "func:floor"

[[word]]
forms = ["sinus"]
sense = "func:sin"

[[word]]
forms = ["cosinus"]
