# Mots français de la calculatrice. Voir README.md pour le format.

[meta]
code = "fr"
name = "Français"
decimal_separator = ","
date_order = "dmy"

# ---------------------------------------------------------------- conversion et opérateurs

[[word]]
forms = ["en", "vers", "convertir en", "converti en"]
sense = "convert_to"
priority = 30

[[word]]
forms = ["de", "du", "des", "d'"]
sense = "of"
when = { after = "percent" }

[[word]]
forms = ["pourcent", "pour cent", "pourcents"]
sense = "percent"

[[word]]
forms = ["fois", "multiplié par", "multiplie par"]
sense = "op:*"

[[word]]
forms = ["divisé par", "divise par", "sur"]
sense = "op:/"

[[word]]
forms = ["plus"]
sense = "op:+"

[[word]]
forms = ["moins"]
sense = "op:-"

[[word]]
forms = ["puissance", "exposant", "à la puissance"]
sense = "op:^"

[[word]]
forms = ["modulo"]
sense = "op:mod"

[[word]]
forms = ["au carré"]
sense = "fend:^2"

[[word]]
forms = ["au cube"]
sense = "fend:^3"

[[word]]
forms = ["un", "une"]
sense = "one"
when = { before = "unit" }

# ---------------------------------------------------------------- octets

[[word]]
forms = ["o", "octet", "octets"]
sense = "unit:byte"
when = { after = ["number", "sense:convert_to"] }

[[word]]
forms = ["octet", "octets"]
sense = "unit:byte"
priority = -1

[[word]]
forms = ["Ko", "ko", "kio-octet"]
sense = "unit:kB"
case_sensitive = true

[[word]]
forms = ["Mo"]
sense = "unit:MB"
case_sensitive = true

[[word]]
forms = ["Go"]
sense = "unit:GB"
case_sensitive = true

[[word]]
forms = ["To"]
sense = "unit:TB"
case_sensitive = true

[[word]]
forms = ["Po"]
sense = "unit:PB"
case_sensitive = true

[[word]]
forms = ["Kio"]
sense = "unit:KiB"

[[word]]
forms = ["Mio"]
sense = "unit:MiB"

[[word]]
forms = ["Gio"]
sense = "unit:GiB"

[[word]]
forms = ["Tio"]
sense = "unit:TiB"

[[word]]
forms = ["Pio"]
sense = "unit:PiB"

# ---------------------------------------------------------------- temps

[[word]]
forms = ["j"]
sense = "unit:day"
when = { after = ["number", "sense:convert_to"] }
case_sensitive = true

[[word]]
forms = ["jour", "jours"]
sense = "unit:day"

[[word]]
forms = ["semaine", "semaines", "sem"]
sense = "unit:week"

[[word]]
forms = ["an", "ans", "année", "années"]
sense = "unit:year"
when = { after = "number" }
priority = 10

# `années depuis 1999`.
[[word]]
forms = ["an", "ans", "année", "années"]
sense = "unit:year"
when = { before = ["sense:until", "sense:since"] }
priority = 10

[[word]]
forms = ["mois"]
sense = "unit:month"

[[word]]
forms = ["min"]
sense = "unit:min"

[[word]]
forms = ["minute", "minutes"]
sense = "unit:minute"

[[word]]
forms = ["heure", "heures"]
sense = "unit:hour"

[[word]]
forms = ["seconde", "secondes"]
sense = "unit:second"

