# ---------------------------------------------------------------- dates et heures

[[word]]
forms = ["maintenant"]
sense = "now"

[[word]]
forms = ["aujourd'hui", "aujourd' hui"]
sense = "today"

[[word]]
forms = ["demain"]
sense = "tomorrow"

[[word]]
forms = ["hier"]
sense = "yesterday"

[[word]]
forms = ["il y a"]
sense = "ago"
when = { position = "start", before = "duration" }

[[word]]
forms = ["dans"]
sense = "relative_in"
when = { position = "start", before = "duration" }

[[word]]
forms = ["jusqu'au", "jusqu'à", "jusqu'a", "jusqu'au le", "avant le"]
sense = "until"

[[word]]
forms = ["depuis le", "depuis"]
sense = "since"

[[word]]
forms = ["quel jour", "quel jour était le", "quel jour sera le", "quel jour le", "quel jour tombe le"]
sense = "what_day"

[[word]]
forms = ["heure à", "l'heure à", "quelle heure à", "heure a", "quelle heure est-il à"]
sense = "time_in"

# `4 Go à 100 Mbit/s`: `a` sans accent seulement entre une quantité et un débit.
[[word]]
forms = ["à", "a"]
sense = "rate_at"
when = { between = ["quantity", "quantity"] }
priority = 10

# `1er janvier`.
[[word]]
forms = ["er"]
sense = "ignore"
when = { after = "number" }

