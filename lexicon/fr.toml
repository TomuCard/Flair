[[word]]
forms = ["sinus"]
sense = "func:sin"

[[word]]
forms = ["cosinus"]
sense = "func:cos"

[[word]]
forms = ["tangente"]
sense = "func:tan"

[[word]]
forms = ["factorielle"]
sense = "func:factorial"

# ---------------------------------------------------------------- bases et formats

[[word]]
