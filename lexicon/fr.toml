[[word]]
forms = ["quart de", "un quart de", "le quart de"]
sense = "fend:(1/4) *"

[[word]]
forms = ["vitesse de la lumière"]
sense = "const:c"

# `20 m²`, `pieds carrés`, `mètres cubes`.
[[word]]
forms = ["carré", "carrés", "carrée", "carrées"]
