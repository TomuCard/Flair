when = { after = "unit" }

[[word]]
forms = ["cube", "cubes"]
sense = "fend:^3"
when = { after = "unit" }

[[word]]
forms = ["premier", "est premier"]
sense = "func:isprime"

[[word]]
forms = ["arrondi", "arrondir"]
sense = "func:round"

[[word]]
forms = ["valeur absolue"]
sense = "func:abs"

[[word]]
forms = ["partie entière"]
