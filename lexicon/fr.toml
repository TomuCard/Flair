# ---------------------------------------------------------------- fonctions

[[word]]
forms = ["racine", "racine carrée", "racine de", "racine carrée de"]
sense = "func:sqrt"

[[word]]
forms = ["racine cubique", "racine cubique de"]
sense = "func:cbrt"

[[word]]
forms = ["pgcd"]
sense = "func:gcd"

[[word]]
forms = ["ppcm"]
sense = "func:lcm"

# `combien font 2 + 2`, `est-ce que 17 est premier`.
[[word]]
forms = ["combien font", "combien fait", "combien vaut", "combien valent", "combien égale", "quel est", "quelle est", "que vaut", "calcule", "calculer", "est-ce que"]
sense = "ignore"
when = { position = "start" }

# `la moitié de 50`, `le double de 21`.
[[word]]
forms = ["moitié de", "la moitié de", "demi de"]
sense = "fend:0.5 *"

[[word]]
forms = ["double de", "le double de"]
sense = "fend:2 *"

[[word]]
forms = ["triple de", "le triple de"]
sense = "fend:3 *"

[[word]]
forms = ["tiers de", "un tiers de", "le tiers de"]
