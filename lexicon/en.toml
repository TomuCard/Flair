# English words of the calculator. See README.md for the format.

[meta]
code = "en"
name = "English"
decimal_separator = "."
date_order = "mdy"

# ---------------------------------------------------------------- conversion and operators
# The same word `in` has three senses: conversion, "in 90 min", inch.

[[word]]
forms = ["to", "as", "into", "convert to"]
sense = "convert_to"
priority = 30

[[word]]
forms = ["in"]
sense = "convert_to"
when = { between = ["quantity", "unit"] }
priority = 30

[[word]]
forms = ["in"]
sense = "relative_in"
when = { position = "start", before = "duration" }
priority = 20

[[word]]
forms = ["in"]
sense = "unit:inch"
when = { after = "number" }
priority = 10

[[word]]
forms = ["of"]
sense = "of"
when = { after = "percent" }

[[word]]
forms = ["percent", "per cent"]
sense = "percent"

[[word]]
forms = ["times", "multiplied by"]
sense = "op:*"

[[word]]
forms = ["divided by", "over"]
sense = "op:/"

[[word]]
forms = ["plus"]
sense = "op:+"

[[word]]
forms = ["minus"]
sense = "op:-"

[[word]]
forms = ["to the power of", "power"]
sense = "op:^"

[[word]]
forms = ["modulo"]
sense = "op:mod"

[[word]]
forms = ["squared"]
sense = "fend:^2"

[[word]]
forms = ["cubed"]
sense = "fend:^3"

[[word]]
forms = ["an", "a"]
sense = "one"
when = { before = "unit" }

# ---------------------------------------------------------------- bytes

[[word]]
forms = ["byte", "bytes"]
sense = "unit:byte"

# ---------------------------------------------------------------- time

[[word]]
forms = ["d"]
sense = "unit:day"
when = { after = ["number", "sense:convert_to"] }
case_sensitive = true

[[word]]
forms = ["day", "days"]
sense = "unit:day"

[[word]]
forms = ["w", "wk", "wks"]
sense = "unit:week"
when = { after = ["number", "sense:convert_to"] }
case_sensitive = true

[[word]]
forms = ["week", "weeks"]
sense = "unit:week"

[[word]]
forms = ["y", "yr", "yrs"]
sense = "unit:year"
when = { after = ["number", "sense:convert_to"] }
case_sensitive = true

[[word]]
forms = ["year", "years"]
sense = "unit:year"

[[word]]
forms = ["month", "months"]
sense = "unit:month"

[[word]]
forms = ["min"]
sense = "unit:min"

[[word]]
forms = ["mins"]
sense = "unit:min"

[[word]]
forms = ["minute", "minutes"]
sense = "unit:minute"

[[word]]
forms = ["hour", "hours", "hr", "hrs"]
sense = "unit:hour"

[[word]]
forms = ["second", "seconds", "sec", "secs"]
sense = "unit:second"

# ---------------------------------------------------------------- lengths, masses, volumes

[[word]]
forms = ["light year", "light years", "light-year", "light-years", "ly"]
sense = "unit:light_year"

[[word]]
forms = ["tbsp", "tablespoon", "tablespoons"]
sense = "unit:tablespoon"

[[word]]
forms = ["tsp", "teaspoon", "teaspoons"]
sense = "unit:teaspoon"

[[word]]
forms = ["kilo", "kilos"]
sense = "unit:kilogram"

[[word]]
forms = ["metric ton", "metric tons", "ton", "tons"]
sense = "unit:tonne"

# ---------------------------------------------------------------- angles and temperatures

[[word]]
forms = ["degree celsius", "degrees celsius", "celsius"]
sense = "unit:°C"

[[word]]
forms = ["degree fahrenheit", "degrees fahrenheit", "fahrenheit"]
sense = "unit:°F"

# ---------------------------------------------------------------- functions

[[word]]
forms = ["square root of", "square root", "root of"]
sense = "func:sqrt"

[[word]]
forms = ["cube root of", "cube root"]
sense = "func:cbrt"

[[word]]
forms = ["prime"]
sense = "func:isprime"

[[word]]
forms = ["absolute value of", "absolute value"]
sense = "func:abs"

[[word]]
forms = ["factorial"]
sense = "func:factorial"

# ---------------------------------------------------------------- bases and formats

[[word]]
forms = ["hexadecimal"]
sense = "fend:hex"

[[word]]
forms = ["binary"]
sense = "fend:binary"

[[word]]
forms = ["decimal"]
sense = "fend:decimal"

# ---------------------------------------------------------------- dates and times

[[word]]
forms = ["now"]
sense = "now"

[[word]]
forms = ["today"]
sense = "today"

[[word]]
forms = ["tomorrow"]
sense = "tomorrow"

[[word]]
forms = ["yesterday"]
sense = "yesterday"

[[word]]
forms = ["ago"]
sense = "ago"
when = { position = "end", after = "duration" }

[[word]]
forms = ["until", "till"]
sense = "until"

[[word]]
forms = ["since"]
sense = "since"

[[word]]
forms = ["what day", "what day is", "what day was", "what day is it on"]
sense = "what_day"

[[word]]
forms = ["time in", "what time in", "what time is it in"]
sense = "time_in"

[[word]]
forms = ["at"]
sense = "rate_at"
when = { between = ["quantity", "quantity"] }

[[word]]
forms = ["st", "nd", "rd", "th"]
sense = "ignore"
when = { after = "number" }

[[word]]
forms = ["January", "jan"]
sense = "month:1"

[[word]]
forms = ["February", "feb"]
sense = "month:2"

[[word]]
forms = ["March", "mar"]
sense = "month:3"

[[word]]
forms = ["April", "apr"]
sense = "month:4"

[[word]]
forms = ["May"]
sense = "month:5"

[[word]]
forms = ["June", "jun"]
sense = "month:6"

[[word]]
forms = ["July", "jul"]
sense = "month:7"

[[word]]
forms = ["August", "aug"]
sense = "month:8"

[[word]]
forms = ["September", "sep", "sept"]
sense = "month:9"

[[word]]
forms = ["October", "oct"]
sense = "month:10"

[[word]]
forms = ["November", "nov"]
sense = "month:11"

[[word]]
forms = ["December", "dec"]
sense = "month:12"

[[word]]
forms = ["Monday", "mon"]
sense = "weekday:1"

[[word]]
forms = ["Tuesday", "tue"]
sense = "weekday:2"

[[word]]
forms = ["Wednesday", "wed"]
sense = "weekday:3"

[[word]]
forms = ["Thursday", "thu"]
sense = "weekday:4"

[[word]]
forms = ["Friday", "fri"]
sense = "weekday:5"

[[word]]
forms = ["Saturday"]
sense = "weekday:6"

[[word]]
forms = ["Sunday"]
sense = "weekday:7"

# ---------------------------------------------------------------- currencies

[[word]]
forms = ["pound sterling", "pounds sterling"]
sense = "unit:GBP"

[[word]]
forms = ["swiss franc", "swiss francs"]
sense = "unit:CHF"
