[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/TomuCard/Flair"

[workspace.dependencies]
flair-core = { path = "crates/flair-core" }
flair-platform = { path = "crates/flair-platform" }

anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
directories = "6.0.0"
fluent-bundle = "0.16.0"
global-hotkey = "0.10.0"
interprocess = "2.4.10"
ksni = { version = "0.3.8", default-features = false, features = ["tokio"] }
resvg = { version = "0.50.0", default-features = false }
serde_json = "1.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
toml_edit = "0.25.21"
tray-icon = { version = "0.27.0", default-features = false }
x11rb = { version = "0.13.2", features = ["xkb"] }
iced = { version = "0.14.0", default-features = false }
palette = { version = "0.7.7", default-features = false, features = ["std"] }
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
thiserror = "2.0.21"
toml = "1.2.3"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unic-langid = { version = "0.9.6", features = ["macros"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
