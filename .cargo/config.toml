# Statically link the MSVC C runtime so flair.exe runs on a fresh Windows
# install without the Visual C++ Redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
    # The static CRT references Microsoft's private PDBs: harmless LNK4099 warnings.
    "-C", "link-arg=/ignore:4099",
]
