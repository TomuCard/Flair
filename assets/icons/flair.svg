<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
  <!-- Flair logo: lens flare. Two concentric rings, and a small circle passing
       in front of them at the top left. The small circle masks the rings (it
       does not paint over them), so the icon works on any background.
       Single color (currentColor): tint it with a theme color. -->
  <defs>
    <mask id="flair-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff" stroke="none"/>
      <circle cx="6.5" cy="6.5" r="5" fill="#000" stroke="none"/>
    </mask>
  </defs>
  <g mask="url(#flair-cut)">
    <circle cx="14" cy="14" r="8.5"/>
    <circle cx="14" cy="14" r="4.25"/>
  </g>
  <circle cx="6.5" cy="6.5" r="3"/>
</svg>
