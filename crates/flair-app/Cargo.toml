[package]
name = "flair-app"
build = "build.rs"
description = "Flair: a keyboard launcher for Windows and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "flair"
path = "src/main.rs"

[build-dependencies]
ico = "0.6.0"
resvg = { workspace = true }
winresource = "0.1.34"

[dependencies]
flair-core.workspace = true
flair-platform.workspace = true
flair-providers.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
notify = { version = "9.0.0", default-features = false }
tracing.workspace = true
serde.workspace = true
semver.workspace = true
thiserror.workspace = true
ureq.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
# Only the features Flair uses: both renderers (GPU and software), SVG icons,
# pixel icons (already decoded: no image codecs),
# X11 and Wayland, thread pool to run searches off the UI thread.
iced = { workspace = true, features = ["wgpu", "tiny-skia", "svg", "image-without-codecs", "crisp", "web-colors", "thread-pool", "x11", "wayland"] }

[dev-dependencies]
flair-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
