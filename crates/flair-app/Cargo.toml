[package]
name = "flair-app"
description = "Flair: a keyboard launcher for Windows and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "flair"
path = "src/main.rs"

[dependencies]
flair-core.workspace = true
flair-platform.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
# Only the features Flair uses: both renderers (GPU and software), SVG icons,
# X11 and Wayland, thread pool to run searches off the UI thread.
iced = { workspace = true, features = ["wgpu", "tiny-skia", "svg", "crisp", "web-colors", "thread-pool", "x11", "wayland"] }

[lints]
workspace = true
