[package]
name = "flair-platform"
description = "OS-specific code for Flair: paths, global shortcut, app listing, icons, IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
flair-core.workspace = true
directories.workspace = true
interprocess.workspace = true
memmap2 = "0.9.12"
png.workspace = true
resvg.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.18.0", default-features = false }
# Event-driven on Windows (hidden message window). Not used on X11: its X11
# backend polls every 50 ms, see `hotkey/x11.rs`.
global-hotkey.workspace = true
tray-icon.workspace = true
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }


[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { workspace = true, features = ["xtest"] }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Tray: StatusNotifierItem over D-Bus with ksni on a Tokio runtime. Not
# through tray-icon, which forces the async-io stack whose `blocking` pool
# keeps a thread waking up every 500 ms forever (see `tray/linux.rs`).
freedesktop-icons = "0.4.0"
libc = "0.2.191"
ksni.workspace = true
rfd.workspace = true
tokio.workspace = true
x11rb.workspace = true
